apiVersion: v1
kind: Namespace
metadata:
  name: cloudops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions-api
  namespace: cloudops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transactions-api
  template:
    metadata:
      labels:
        app: transactions-api
    spec:
      containers:
        - name: api
          image: cloudops-transactions-api:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: transactions-api
  namespace: cloudops
spec:
  type: ClusterIP
  selector:
    app: transactions-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
